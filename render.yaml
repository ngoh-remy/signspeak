services:
  - type: web
    name: signspeak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://signspeak.vercel.app
      - key: DATABASE_URL
        value: sqlite:///./signspeak.db
      - key: PYTHON_VERSION
        value: "3.11.0"
