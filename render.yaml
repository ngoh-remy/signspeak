services:
  - type: web
    name: signspeak-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://signspeak2.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: signspeak-db
          property: connectionString
      - key: PORT
        value: "8000"

databases:
  - name: signspeak-db
    databaseName: signspeak
    user: signspeak
    plan: free
